<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="description" content="Your personal multi-sport dashboard with AI coach" />
  <title>RunCoach AI</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- ── Header ──────────────────────────────────────────────────────────── -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-brand">
        <span class="header-logo">🏃</span>
        <span class="header-title">RunCoach AI</span>
      </div>
      <div class="header-right">
        <!-- Sport filter -->
        <select id="sport-filter" class="sport-select" title="Filter by sport">
          <option value="all">All sports</option>
          <option value="Run">🏃 Running</option>
          <option value="Ride">🚴 Cycling</option>
          <option value="Swim">🏊 Swimming</option>
          <option value="Tennis">🎾 Tennis</option>
          <option value="Badminton">🏸 Badminton</option>
        </select>
        <button id="sync-btn" class="btn-sync" title="Sync with Garmin">↻</button>
      </div>
    </div>
  </header>

  <!-- ── Main content ─────────────────────────────────────────────────────── -->
  <main id="main-content">

    <!-- ── Dashboard Tab ──────────────────────────────────────────────────── -->
    <section id="tab-dashboard" class="tab-content active">
      <div class="container">

        <div class="sync-bar" id="sync-bar">
          <span id="sync-status">Loading…</span>
          <button class="btn-upload-small" id="open-upload">+ Upload FIT/GPX</button>
        </div>

        <!-- Stat cards -->
        <div class="stats-grid" id="stats-grid">
          <div class="stat-card skeleton"></div>
          <div class="stat-card skeleton"></div>
          <div class="stat-card skeleton"></div>
          <div class="stat-card skeleton"></div>
        </div>

        <!-- Weekly chart -->
        <div class="chart-card">
          <h2 class="card-title">Weekly Distance <span class="card-sub">(last 10 weeks)</span></h2>
          <div class="chart-wrap"><canvas id="weekly-chart"></canvas></div>
        </div>

        <!-- Pace / Speed trend -->
        <div class="chart-card">
          <h2 class="card-title">Pace Trend <span class="card-sub">(recent runs)</span></h2>
          <div class="chart-wrap"><canvas id="pace-chart"></canvas></div>
        </div>

      </div>
    </section>

    <!-- ── Activities Tab ──────────────────────────────────────────────────── -->
    <section id="tab-activities" class="tab-content">
      <div class="container">
        <div class="activities-toolbar">
          <input id="search-input" class="search-input" type="search" placeholder="Search activities…" />
          <button class="btn-manual" id="open-manual">+ Manual</button>
        </div>
        <div id="activities-list"></div>
      </div>
    </section>

    <!-- ── Activity Detail Tab ────────────────────────────────────────────── -->
    <section id="tab-detail" class="tab-content">
      <div class="container">
        <button class="btn-back" id="back-btn">← Back</button>
        <div id="detail-content"></div>
      </div>
    </section>

    <!-- ── Objectives Tab ─────────────────────────────────────────────────── -->
    <section id="tab-objectives" class="tab-content">
      <div class="container">
        <div class="objectives-header">
          <h2 class="section-title">🎯 My Objectives</h2>
          <button class="btn-add-obj" id="open-add-obj">+ Add</button>
        </div>
        <div id="objectives-list"></div>
      </div>
    </section>

    <!-- ── AI Coach Tab ───────────────────────────────────────────────────── -->
    <section id="tab-chat" class="tab-content chat-tab">
      <div class="chat-wrapper">
        <div class="chat-messages" id="chat-messages">
          <div class="chat-welcome">
            <div class="chat-welcome-icon">🤖</div>
            <h3>Your AI Sports Coach</h3>
            <p>I know your training data across all your sports. Ask me anything!</p>
            <div class="chip-grid">
              <button class="chip" data-msg="What should I train today based on my recent activities?">What to train today?</button>
              <button class="chip" data-msg="Analyse my progress over the last month and give me feedback">Analyse my progress</button>
              <button class="chip" data-msg="Suggest a running route and the ideal distance for my fitness level">Route suggestion</button>
              <button class="chip" data-msg="Build me a 4-week training plan to improve my performance">4-week training plan</button>
              <button class="chip" data-msg="How can I improve my running pace based on my current data?">Improve my pace</button>
              <button class="chip" data-msg="What are the signs of overtraining in my data?">Am I overtraining?</button>
            </div>
          </div>
        </div>
        <div class="chat-input-area">
          <div class="chat-row">
            <textarea id="chat-input" class="chat-input" rows="1" placeholder="Ask your coach…"></textarea>
            <button id="chat-send" class="btn-send" aria-label="Send">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="18" height="18">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
          <button id="clear-chat" class="btn-clear">Clear conversation</button>
        </div>
      </div>
    </section>

  </main>

  <!-- ── Bottom Tab Nav ──────────────────────────────────────────────────── -->
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="dashboard"><span class="ti">📊</span><span>Dashboard</span></button>
    <button class="tab-btn" data-tab="activities"><span class="ti">📋</span><span>Activities</span></button>
    <button class="tab-btn" data-tab="objectives"><span class="ti">🎯</span><span>Goals</span></button>
    <button class="tab-btn" data-tab="chat"><span class="ti">🤖</span><span>Coach</span></button>
  </nav>

  <!-- ── Upload Modal ───────────────────────────────────────────────────── -->
  <div class="modal-overlay hidden" id="upload-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Upload Activity</h3>
        <button class="modal-close" data-modal="upload-modal">✕</button>
      </div>
      <div
        class="drop-zone"
        id="drop-zone"
        ondragover="event.preventDefault()"
        ondrop="handleDrop(event)"
      >
        <div class="drop-icon">📁</div>
        <p>Drag & drop a <strong>.fit</strong> or <strong>.gpx</strong> file here</p>
        <p class="muted">or</p>
        <label class="btn-file-label">
          Choose file
          <input type="file" id="file-input" accept=".fit,.gpx" hidden />
        </label>
      </div>
      <div id="upload-result" class="upload-result hidden"></div>
    </div>
  </div>

  <!-- ── Manual Entry Modal ────────────────────────────────────────────── -->
  <div class="modal-overlay hidden" id="manual-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Log Activity Manually</h3>
        <button class="modal-close" data-modal="manual-modal">✕</button>
      </div>
      <form id="manual-form" class="form">
        <div class="form-row">
          <label>Sport</label>
          <select name="sport" required>
            <option value="Run">🏃 Running</option>
            <option value="Ride">🚴 Cycling</option>
            <option value="Swim">🏊 Swimming</option>
            <option value="Tennis">🎾 Tennis</option>
            <option value="Badminton">🏸 Badminton</option>
          </select>
        </div>
        <div class="form-row">
          <label>Name (optional)</label>
          <input type="text" name="name" placeholder="e.g. Morning Run" />
        </div>
        <div class="form-row">
          <label>Date</label>
          <input type="date" name="date" required />
        </div>
        <div class="form-row two-col">
          <div>
            <label>Duration (min)</label>
            <input type="number" name="durationMin" min="1" required placeholder="45" />
          </div>
          <div>
            <label>Distance (km)</label>
            <input type="number" name="distanceKm" step="0.01" placeholder="8.5" />
          </div>
        </div>
        <div class="form-row">
          <label>Avg Heart Rate (bpm)</label>
          <input type="number" name="avgHeartrate" placeholder="150" />
        </div>
        <div class="form-row">
          <label>Notes</label>
          <textarea name="notes" rows="2" placeholder="How did it feel?"></textarea>
        </div>
        <button type="submit" class="btn-primary">Save activity</button>
      </form>
    </div>
  </div>

  <!-- ── Add Objective Modal ───────────────────────────────────────────── -->
  <div class="modal-overlay hidden" id="obj-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Add Objective</h3>
        <button class="modal-close" data-modal="obj-modal">✕</button>
      </div>
      <form id="obj-form" class="form">
        <div class="form-row">
          <label>Title</label>
          <input type="text" name="title" required placeholder="e.g. Run a half marathon" />
        </div>
        <div class="form-row">
          <label>Sport</label>
          <select name="sport" required>
            <option value="Run">🏃 Running</option>
            <option value="Ride">🚴 Cycling</option>
            <option value="Swim">🏊 Swimming</option>
            <option value="Tennis">🎾 Tennis</option>
            <option value="Badminton">🏸 Badminton</option>
            <option value="all">All sports</option>
          </select>
        </div>
        <div class="form-row">
          <label>Type</label>
          <select name="type" id="obj-type" required>
            <option value="distance">📏 Total Distance (km)</option>
            <option value="frequency">🔁 Number of Sessions</option>
            <option value="race">🏅 Race Goal</option>
            <option value="pace">⚡ Target Pace</option>
          </select>
        </div>
        <div class="form-row" id="obj-value-row">
          <label id="obj-value-label">Target (km)</label>
          <input type="number" name="targetValue" step="0.1" placeholder="100" />
        </div>
        <div class="form-row hidden" id="obj-race-row">
          <label>Race Distance</label>
          <select name="raceType">
            <option value="5k">5K</option>
            <option value="10k">10K</option>
            <option value="half">Half Marathon</option>
            <option value="marathon">Marathon</option>
          </select>
        </div>
        <div class="form-row hidden" id="obj-pace-row">
          <label>Target Pace (mm:ss)</label>
          <input type="text" name="targetPace" placeholder="5:00" pattern="\d+:\d{2}" />
        </div>
        <div class="form-row two-col">
          <div>
            <label>Period (days)</label>
            <input type="number" name="periodDays" value="30" min="1" placeholder="30" />
          </div>
          <div>
            <label>Target Date</label>
            <input type="date" name="targetDate" />
          </div>
        </div>
        <button type="submit" class="btn-primary">Save objective</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
